name: One-time NVDA upstream formatting cleanup

on:
  push:
    branches:
      - balloon-upstream-style-cleanup-2026-11-12
    paths:
      - .github/workflows/balloon-style-cleanup-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format only flagged C++ and JSON files
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq astyle
          files=(
            src/accessibility.cpp
            src/advanced_inv.cpp
            src/armor_layers.cpp
            src/construction.cpp
            src/crafting_gui.cpp
            src/game.cpp
            src/handle_action.cpp
            src/input_context.cpp
            src/main_menu.cpp
            src/newcharacter.cpp
            src/overmap_ui.cpp
            src/player_display.cpp
            src/ranged.cpp
            src/safemode_ui.cpp
            src/sidebar_accessibility.cpp
            src/surroundings_menu.cpp
            src/ui_extended_description.cpp
            src/veh_appliance.cpp
            src/veh_interact.cpp
            src/worldfactory.cpp
            src/zone_manager_ui.cpp
            tests/sidebar_accessibility_test.cpp
          )
          for file in "${files[@]}"; do
            astyle --quiet --options=.astylerc -n "$file"
          done
          make tools/format/json_formatter.cgi RELEASE=1 -j2
          # The JSON formatter returns 1 when it successfully rewrites a file.
          tools/format/json_formatter.cgi data/raw/keybindings.json || test "$?" -eq 1
          git add -- "${files[@]}" data/raw/keybindings.json
          git diff --cached --check
          echo "Changed files:"
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No formatting changes necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format NVDA accessibility C++ and keybindings JSON"
          git push origin HEAD:balloon-upstream-style-cleanup-2026-11-12
