name: Safely update upstream balloon from CleverRaven

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: balloon-upstream-safe-merge
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out canonical upstream balloon
        uses: actions/checkout@v4
        with:
          ref: balloon-upstream
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch and safely merge current CleverRaven master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add cleverraven https://github.com/CleverRaven/Cataclysm-DDA.git
          git fetch --no-tags cleverraven master
          echo "CleverRaven master: $(git rev-parse FETCH_HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Candidate before merge: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          # Never silently choose upstream or ours at a conflict.
          # Only source/data from CleverRaven are imported, not its workflows.
          python3 -m py_compile build-scripts/balloon_nov21_reconcile.py
          # Squash imports upstream source without pushing upstream's workflow-history
          # commits, which GitHub App credentials lack permission to publish.
          if ! git merge --squash FETCH_HEAD; then
            # Only the six inspected files may conflict. Do not auto-resolve anything else.
            python3 - <<'PY'
          import subprocess
          expected = {
              "data/mods/Xedra_Evolved/mutations/paraclesians/sylph_eocs.json",
              "data/mods/Xedra_Evolved/mutations/paraclesians/sylph_mutation_spells.json",
              "data/mods/Xedra_Evolved/mutations/paraclesians/sylph_spell_learning_eocs.json",
              "src/iuse_actor.cpp",
              "src/map.cpp",
              "src/npctalk.cpp",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=U"], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"Unexpected conflict set: {sorted(actual ^ expected)}")
          print("Six expected conflicts verified; applying reviewed source ports")
          PY
            # Xedra files require the new upstream Sylph progression consistently.
            # The three C++ files were reorganized: their accessibility changes
            # are explicitly reintroduced below in the new upstream locations.
            git checkout --theirs -- \
              data/mods/Xedra_Evolved/mutations/paraclesians/sylph_eocs.json \
              data/mods/Xedra_Evolved/mutations/paraclesians/sylph_mutation_spells.json \
              data/mods/Xedra_Evolved/mutations/paraclesians/sylph_spell_learning_eocs.json \
              src/iuse_actor.cpp src/map.cpp src/npctalk.cpp
            git add -- \
              data/mods/Xedra_Evolved/mutations/paraclesians/sylph_eocs.json \
              data/mods/Xedra_Evolved/mutations/paraclesians/sylph_mutation_spells.json \
              data/mods/Xedra_Evolved/mutations/paraclesians/sylph_spell_learning_eocs.json \
              src/iuse_actor.cpp src/map.cpp src/npctalk.cpp
            python3 build-scripts/balloon_nov21_reconcile.py
            python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("data/mods/Xedra_Evolved/mutations/paraclesians")
          for p in (root/"sylph_eocs.json",root/"sylph_mutation_spells.json",
                    root/"sylph_spell_learning_eocs.json"):
              json.loads(p.read_text())
          print("Resolved Sylph JSON files parse successfully")
          PY
            git add -- src/iuse_actor.cpp src/dialogue.cpp src/map_cache.cpp
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "::error::Unresolved conflicts remain"
              exit 1
            fi
            git diff --cached --check -- src/iuse_actor.cpp src/dialogue.cpp src/map_cache.cpp
          fi
          # Upstream workflow files are infrastructure and must not be overwritten
          # by source synchronization. The bot can push ordinary source changes.
          git restore --source=HEAD --staged --worktree -- .github/workflows
          if [ -n "$(git diff --cached --name-only -- .github/workflows)" ]; then
            echo "::error::Workflow changes remain staged; refusing push."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No source changes to import." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git diff --cached --check -- src/iuse_actor.cpp src/dialogue.cpp src/map_cache.cpp
            git commit -m "Integrate upstream CDDA source safely, preserving NVDA customizations"
            git push origin HEAD:balloon-upstream
          fi
          echo "Merged candidate: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          git diff --check HEAD^ HEAD -- src/iuse_actor.cpp src/dialogue.cpp src/map_cache.cpp
