name: Sync complete NVDA working branch into upstream integration

on:
  push:
    branches:
      - balloon-accessibility-framework
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: balloon-sync-working-upstream
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out upstream integration branch
        uses: actions/checkout@v4
        with:
          ref: balloon-upstream-integration-2026-11-14
          fetch-depth: 0
          persist-credentials: true
      - name: Merge full working history without discarding conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin balloon-accessibility-framework balloon-upstream-integration-2026-11-14
          git checkout -B balloon-upstream-integration-2026-11-14 origin/balloon-upstream-integration-2026-11-14
          if git merge-base --is-ancestor origin/balloon-accessibility-framework HEAD; then
            echo "Upstream integration already contains every working commit."
            exit 0
          fi
          if ! git merge --no-ff --no-commit origin/balloon-accessibility-framework; then
            # The new chargen conflict was reviewed and its accessibility
            # additions were ported to upstream's newer character creator.
            # Refuse any other conflict set rather than risking game changes.
            mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
            actual="$(printf '%s\\n' "${unresolved[@]}" | sort)"
            expected="src/newcharacter.cpp"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Unexpected merge conflicts; refusing to discard changes."
              git status --short
              git merge --abort || true
              exit 1
            fi
            # Never replace newer upstream scenario/rating/portrait logic.
            if ! grep -q 'character_creator_summary_sections' src/newcharacter.cpp ||
               ! git show HEAD:src/newcharacter.cpp | grep -q 'CHARACTER_CREATION_HARD_LIMIT' ||
               ! git show HEAD:src/newcharacter.cpp | grep -q 'Starting location selected'; then
              echo "::error::Reviewed accessibility changes missing from upstream."
              git merge --abort || true
              exit 1
            fi
            git checkout --ours -- src/newcharacter.cpp
            git add src/newcharacter.cpp
            if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
              echo "::error::Unresolved conflicts remain."
              git merge --abort || true
              exit 1
            fi
            echo "Resolved reviewed conflict: upstream chargen retained with NVDA changes."
          fi
          git commit -m "Integrate all cumulative NVDA accessibility fixes from working branch"
          git push origin HEAD:balloon-upstream-integration-2026-11-14
